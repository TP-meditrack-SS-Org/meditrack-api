name: Deploy Render

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  package-server:
    name: Package server artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Prepare dist-server
        run: |
          rm -rf dist-server dist-server.zip
          mkdir -p dist-server
          cp package.json package-lock.json server.js dist-server/
          cp -R src dist-server/src
          if [ -f README.md ]; then cp README.md dist-server/; fi

      - name: Create dist-server.zip
        run: zip -r dist-server.zip dist-server

      - name: Upload dist-server artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-server.zip
          path: dist-server.zip
          if-no-files-found: error

  deploy-render:
    name: Trigger Render deploy
    needs: package-server
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Validate Render configuration
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
        run: |
          if [ -z "$RENDER_API_KEY" ]; then
            echo "Missing RENDER_API_KEY secret."
            exit 1
          fi
          if [ -z "$RENDER_SERVICE_ID" ]; then
            echo "Missing repository variable RENDER_SERVICE_ID."
            exit 1
          fi

      - name: Trigger deploy with Render API
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
        run: |
          curl --fail --show-error --silent \
            --request POST \
            --url "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            --header "accept: application/json" \
            --header "content-type: application/json" \
            --data '{"clearCache":"do_not_clear","deployMode":"build_and_deploy"}'
