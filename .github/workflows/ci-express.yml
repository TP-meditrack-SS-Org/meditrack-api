name: CI Express

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  ci-express:
    uses: TP-meditrack-SS-Org/shared-workflow-ci/.github/workflows/ci-express.yml@5c2cb1f04439c45e94b9fa1ed4252bd3cec3cad2 # chore/supply-chain-hardening
    secrets: inherit
    with:
      node-version: "20"

  integration-tests:
    name: Run staging integration tests
    needs: ci-express
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check staging secrets
        env:
          STAGING_API_KEY: ${{ secrets.STAGING_API_KEY }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          if [ -z "$STAGING_API_KEY" ]; then
            echo "STAGING_API_KEY is not exposed in staging."
            exit 1
          fi
          if [ -z "$STAGING_DATABASE_URL" ]; then
            echo "STAGING_DATABASE_URL is not exposed in staging."
            exit 1
          fi
          echo "STAGING_API_KEY and STAGING_DATABASE_URL are exposed in staging."

      - name: Run integration tests
        env:
          STAGING_API_KEY: ${{ secrets.STAGING_API_KEY }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: npm run test:integration
